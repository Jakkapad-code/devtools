name: Verify Petory

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petory
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: petory
          POSTGRES_USER: petory
          POSTGRES_PASSWORD: petory
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U petory -d petory"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://petory:petory@127.0.0.1:5433/petory
      DATABASE_SSL: "false"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      SESSION_SECRET: ci-session-secret-that-is-longer-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petory/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run db:seed
      - run: npm run test:integration
        env:
          PETORY_INTEGRATION_DB: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: petory-browser-screenshots
          path: petory/test-results/*.png
          if-no-files-found: ignore
